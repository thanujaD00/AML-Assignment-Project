[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dengue-forecast"
version = "1.0.0"
description = "One-week-ahead dengue case prediction for Sri Lankan RDHS divisions using NGBoost with SHAP explanations"
requires-python = ">=3.10"
readme = "README.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
